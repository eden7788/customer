<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에어컨 냉방·난방 설정 가이드 (삼성·LG)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202e; --muted:#5b6776; --line:#dfe4ea; --bg:#f4f6f9; --card:#ffffff;
  --accent:#1f5bd8; --accent-soft:#e8f0fe; --ok:#1a8f5a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
h1{margin:6px 0 8px;font-size:clamp(24px,4.6vw,34px);line-height:1.25;letter-spacing:-.01em}
.lead{margin:0 0 20px;color:var(--muted);font-size:15.5px;max-width:680px}
button:focus-visible{outline:3px solid #9bbcff;outline-offset:2px}

/* manufacturer picker */
.picks{display:grid;grid-template-columns:1fr;gap:14px;max-width:1000px;margin-top:8px}
@media(min-width:760px){.picks{grid-template-columns:1fr 1fr 1fr}}
.pick{appearance:none;font:inherit;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 20px;cursor:pointer;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.pick:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(31,91,216,.12);transform:translateY(-1px)}
.pick .nm{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pick .ds{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.pick .go{display:block;margin-top:14px;font-size:14px;font-weight:700;color:var(--accent)}
.hint{margin-top:18px;font-size:13.5px;color:var(--muted);max-width:680px}

/* guide */
.back{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;padding:6px 8px 6px 0;margin-bottom:6px}
.back:hover{color:var(--accent)}
.tabs{display:inline-flex;gap:4px;padding:4px;background:#e7ebf1;border-radius:12px;margin-bottom:18px;max-width:100%;flex-wrap:wrap}
.tabs button{appearance:none;border:0;background:transparent;font:inherit;font-weight:500;font-size:14.5px;color:var(--muted);padding:9px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,32,46,.12)}
@media(max-width:600px){
  .stage,.stage.dark{padding:4px}
  .card{padding:10px}
  .tabs{display:flex;width:100%;flex-wrap:nowrap}
  .tabs button{flex:1;padding:9px 6px;font-size:13px;line-height:1.3}
}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:880px){.grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:6px}
.stage.dark{background:#222831;border-color:#222831;padding:10px}
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:'Noto Sans KR',system-ui,sans-serif}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips .lbl{font-size:13.5px;color:var(--muted);margin-right:2px}
.chip{appearance:none;font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:12px}
.ctrl button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:500;min-width:44px;height:40px;border-radius:10px;cursor:pointer;padding:0 12px}
.ctrl button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
.ctrl .count{margin-left:auto;font-size:13px;color:var(--muted)}
.bar{height:4px;background:#e7ebf1;border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.step>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.step>button:hover{background:#f6f8fb}
.step>button:focus-visible{outline:3px solid #9bbcff;outline-offset:2px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:#e7ebf1;color:var(--muted);font-weight:700;font-size:14px;display:grid;place-items:center}
.step .b{display:block;min-width:0}
.step strong{display:block;font-size:15.5px;font-weight:700}
.step .d{display:block;max-height:0;overflow:hidden;opacity:0;color:var(--muted);font-size:14.5px;transition:max-height .35s,opacity .35s,margin .35s}
.step .d b{color:var(--ink)}
.step.on>button{background:var(--accent-soft);border-color:#c9dafc}
.step.on .n{background:var(--accent);color:#fff}
.step.on .d{max-height:260px;opacity:1;margin-top:4px}
.step.done .n{background:var(--ok);color:#fff}
.note{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.note+.note{margin-top:12px}
.note h2{margin:0 0 8px;font-size:15.5px}
.note ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
.note p{margin:0;color:var(--muted);font-size:14.5px}
.note li+li{margin-top:4px}
.foot{margin:14px 2px 0;font-size:12.5px;color:var(--muted)}
.foot a{color:var(--accent)}
.hlbox{fill:rgba(31,91,216,.10);stroke:#1f5bd8;stroke-width:3;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.blink{animation:blink 1.4s steps(1,end) infinite}
@keyframes blink{0%,72%{opacity:1}73%,100%{opacity:0}}
.fing{opacity:0;transition:opacity .3s}
.fing .halo{fill:rgba(255,120,30,.22);stroke:#ff7a1e;stroke-width:2.5}
.fing .dot{fill:#ff7a1e}
.fing .rip{fill:none;stroke:#ff7a1e;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.fing.press .rip{animation:rip .6s ease-out}
@keyframes rip{from{transform:scale(.5);opacity:.9}to{transform:scale(2.6);opacity:0}}
.holdfill{transform-box:fill-box;transform-origin:left center;animation:hold 2s linear forwards}
@keyframes hold{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.hlbox,.blink{animation:none}}
</style>
</head>
<body>

<main class="wrap">

  <!-- 1) 제조사 선택 -->
  <section id="picker" aria-label="제조사 선택">
    <div class="eyebrow">에어컨 설정 가이드</div>
    <h1>냉방·난방이 켜지지 않을 때</h1>
    <p class="lead">계절이 바뀌었는데 냉방(또는 난방)이 선택되지 않나요? 먼저 사용하시는 에어컨의 <b>제조사</b>를 선택해 주세요. 제조사에 맞는 해결 방법을 화면 시연으로 보여드려요.</p>
    <div class="picks">
      <button type="button" class="pick" data-brand="samsung">
        <span class="nm">삼성전자</span>
        <span class="ds">터치식 중앙제어기 · ON/OFF 중앙제어기<br>냉방전용 / 난방전용 설정 풀기</span>
        <span class="go">가이드 보기 →</span>
      </button>
      <button type="button" class="pick" data-brand="lg">
        <span class="nm">LG전자</span>
        <span class="ds">유선 리모컨 · 중앙제어 [HL] 표시<br>냉방·난방이 선택되지 않을 때</span>
        <span class="go">가이드 보기 →</span>
      </button>
      <button type="button" class="pick" data-brand="carrier">
        <span class="nm">캐리어</span>
        <span class="ds">무선 리모컨<br>리모컨 잠금(자물쇠·열쇠 표시) 해제</span>
        <span class="go">가이드 보기 →</span>
      </button>
    </div>
    <p class="hint">제조사는 실내기·리모컨·제어기에 적힌 로고로 확인할 수 있어요.</p>
  </section>

  <!-- 2) 제조사별 가이드 -->
  <section id="guide" hidden>
    <button type="button" class="back" id="back">← 제조사 다시 선택</button>
    <div class="eyebrow" id="g-eyebrow"></div>
    <h1 id="g-title"></h1>
    <p class="lead" id="g-lead"></p>

    <div class="tabs" role="tablist" aria-label="상황 선택" id="tabs"></div>

    <div class="grid">
      <section class="card" aria-label="화면 시연">
        <div class="chips" id="chips"></div>
        <div class="stage" id="stage">
          <svg id="screen" viewBox="0 0 640 370" role="img" aria-label="화면 시연 애니메이션">
            <defs>
              <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd14f"/><stop offset="1" stop-color="#5fa82a"/></linearGradient>
              <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e9ec"/><stop offset="1" stop-color="#d2d7dc"/></linearGradient>
              <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#c9cacd"/></linearGradient>
              <pattern id="stripe" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#d9d9dc"/><rect width="2" height="4" fill="#4a4a4d"/></pattern>
              <clipPath id="zoomClip"><circle cx="455" cy="185" r="150"/></clipPath>
            </defs>
            <g id="scene"></g>
            <g id="hl"></g>
            <g id="finger" class="fing" style="transform:translate(660px,390px)">
              <circle class="rip" r="16"/>
              <circle class="halo" r="16"/>
              <circle class="dot" r="5"/>
            </g>
            <g id="finger2" class="fing" style="transform:translate(660px,390px)">
              <circle class="rip" r="16"/>
              <circle class="halo" r="16"/>
              <circle class="dot" r="5"/>
            </g>
          </svg>
        </div>
        <div class="bar" aria-hidden="true"><i id="prog"></i></div>
        <div class="ctrl">
          <button id="prev" aria-label="이전 단계">◀ 이전</button>
          <button id="play" class="primary" aria-label="일시정지">일시정지</button>
          <button id="next" aria-label="다음 단계">다음 ▶</button>
          <span class="count" id="count"></span>
        </div>
      </section>

      <section aria-label="단계별 설명">
        <ol class="steps" id="steps"></ol>
      </section>
    </div>

    <div id="notes"></div>
    <p class="foot" id="foot"></p>
  </section>

</main>

<script>
(function(){
  if (window.parent === window) return;
  var wrap = document.querySelector('.wrap');
  function post(msg){ try { window.parent.postMessage(msg, '*'); } catch(e) {} }
  function sendHeight(){ post({type:'guide-height', height: Math.ceil(wrap.getBoundingClientRect().height)}); }
  window.notifyParentTop = function(){ post({type:'guide-top'}); };
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(wrap);
  window.addEventListener('load', sendHeight);
  sendHeight();
})();
</script>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};

  /* ---------- SVG helpers ---------- */
  function rect(x,y,w,h,fill,stroke,r,sw){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r==null?4:r)+'" fill="'+fill+'" stroke="'+(stroke||'none')+'" stroke-width="'+(sw||1)+'"/>';
  }
  function txt(x,y,s,size,fill,anchor,weight,extra){
    return '<text x="'+x+'" y="'+y+'" font-size="'+(size||12)+'" fill="'+(fill||'#333')+'" text-anchor="'+(anchor||'middle')+'" font-weight="'+(weight||400)+'" dominant-baseline="central" '+(extra||'')+'>'+s+'</text>';
  }

  /* =============== SAMSUNG scenes =============== */
function btn(x,y,w,h,s,size,disabled){
    return rect(x,y,w,h,disabled?'#e3e5e7':'#fff','#b8bdc3',3)+txt(x+w/2,y+h/2,s,size||12,disabled?'#9aa1a8':'#444');
  }
  function toggleOff(x,y,w,h){
    return rect(x,y,w,h,'#f4f4f5','#b8bdc3',3)+rect(x+2,y+2,w*0.5,h-4,'#fff','#c9cdd2',2)+txt(x+w*0.28,y+h/2,'OFF',11,'#999','middle',700);
  }
  function topbar(title,right){
    return rect(0,0,640,30,'#4b5764','none',0)+txt(320,15,title,14,'#fff')+(right?txt(630,15,right,12,'#fff','end'):'');
  }

  /* ---------- touch controller scenes ---------- */
  var MODELBL={cool:'냉방전용',heat:'난방전용',none:'설정없음'};

  function sceneHome(p){
    var s=rect(0,0,640,370,'#eceef0','none',0);
    s+=txt(630,20,'◷ 오전 09:47',12,'#333','end');
    s+=txt(320,92,'SAMSUNG',26,'#1428a0','middle',700,'letter-spacing="3"');
    s+=txt(320,124,'터치 중앙제어기',14,'#666');
    var xs=[131,266,401], navy='#2e4a7d', cy=205, i, cx;
    for(i=0;i<3;i++){ s+=rect(xs[i],161,108,108,'#f7f7f8','#c9cdd2',8,1.5); }
    // icon 1: monitor + hand
    cx=xs[0]+54;
    s+=rect(cx-18,cy-18,36,28,navy,'none',3)+rect(cx-14,cy-14,28,20,'#8fa6cf','none',2);
    s+='<path d="M'+(cx+3)+' '+(cy-2)+' l0 20 l5 -4 l4 9 l4 -2 l-4 -9 l7 0 z" fill="#fff" stroke="'+navy+'" stroke-width="2" stroke-linejoin="round"/>';
    s+=txt(cx,243,'제어 및',13,'#333')+txt(cx,259,'모니터링',13,'#333');
    // icon 2: schedule
    cx=xs[1]+54;
    s+=rect(cx-19,cy-18,36,32,'#fff',navy,3,2)+rect(cx-19,cy-18,36,8,navy,'none',2);
    s+='<path d="M'+(cx-19)+' '+(cy-2)+' h36 M'+(cx-19)+' '+(cy+6)+' h36 M'+(cx-7)+' '+(cy-10)+' v24 M'+(cx+5)+' '+(cy-10)+' v24" stroke="'+navy+'" stroke-width="1.2" fill="none"/>';
    s+='<circle cx="'+(cx+10)+'" cy="'+(cy+12)+'" r="9" fill="#fff" stroke="'+navy+'" stroke-width="2"/><path d="M'+(cx+10)+' '+(cy+7)+' v5 h4" stroke="'+navy+'" stroke-width="1.6" fill="none"/>';
    s+=txt(cx,251,'스케줄',13,'#333');
    // icon 3: gear
    cx=xs[2]+54;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="none" stroke="'+navy+'" stroke-width="9" stroke-dasharray="7.2 7.2"/><circle cx="'+cx+'" cy="'+cy+'" r="12" fill="'+navy+'"/><circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#f7f7f8"/>';
    s+=txt(cx,251,'설정',13,'#333');
    if(p.toast){ s+=rect(190,306,260,38,'#1a8f5a','none',19)+txt(320,325,'설정이 완료됐어요 ✓',15,'#fff','middle',700); }
    return {svg:s,t:p.toast?{ctl:[131,161,108,108],toast:[190,306,260,38]}:{ctl:[131,161,108,108]}};
  }

  function sceneZone(p){
    var sel=p.sel||[], s=rect(0,0,640,370,'#eceef0','none',0)+topbar('제어 및 모니터링','◷ 오전 09:49');
    s+='<path d="M10 20 l8 -8 l8 8 v8 h-16z" fill="none" stroke="#fff" stroke-width="1.6"/>';
    s+=txt(320,50,'Zone Name#1',13,'#333','middle',700);
    var t={}, i, x, on;
    for(i=0;i<4;i++){
      x=8+i*155; on=sel.indexOf(i)>=0;
      s+=rect(x,62,152,56,on?'#8bbbe6':'#bcd6ec',on?'#1f5bd8':'#9fc1de',3,on?2.5:1);
      s+=txt(x+6,74,'32:00:0'+i,10,'#4a5a6a','start');
      s+=rect(x+10,88,26,18,'none','#5a6b7c',2,1.4)+'<path d="M'+(x+14)+' 100 h18 M'+(x+14)+' 96 h18" stroke="#5a6b7c" stroke-width="1.2"/>';
      s+=txt(x+80,104,'꺼짐',10,'#5a6b7c','start')+txt(x+118,104,'↗24°C',10,'#5a6b7c','start');
      t['t'+i]=[x,62,152,56];
    }
    s+=rect(0,334,640,36,'#f3f4f5','#d3d6da',0,1);
    s+=txt(22,352,'범례',12,'#666','start');
    s+=txt(395,352,'선택 해제',12,sel.length?'#333':'#9aa1a8')+txt(470,352,'켜짐',12,sel.length?'#333':'#9aa1a8');
    s+=rect(535,338,95,28,sel.length?'#fff':'#f3f4f5',sel.length?'#9aa1a8':'#d3d6da',3,1)+txt(582,352,'제어',13,sel.length?'#222':'#9aa1a8','middle',sel.length?700:400);
    t.ctrl=[535,338,95,28];
    return {svg:s,t:t};
  }

  function controlBase(){
    var s=rect(0,0,640,370,'#eef0f1','none',0)+topbar('32:00:03 +3');
    var rows=[['실내운전',60],['실내기운전모드',115],['희망온도',170],['풍량',225],['풍향',280]];
    var vals=[null,'자동','24°C','자동','스윙'], i;
    for(i=0;i<5;i++){
      s+=txt(14,rows[i][1],rows[i][0],13,'#444','start');
      if(i===0){ s+=toggleOff(212,rows[i][1]-15,92,30); }
      else { s+=btn(212,rows[i][1]-15,92,30,vals[i],13); }
    }
    s+='<line x1="325" y1="42" x2="325" y2="326" stroke="#cfd3d7" stroke-width="1.5"/>';
    s+=txt(345,60,'리모컨',13,'#444','start')+btn(480,45,140,30,'리모컨 허용',12);
    s+=txt(345,115,'필터',13,'#444','start')+btn(480,100,140,30,'필터 리셋',12);
    s+=rect(345,263,275,36,'url(#gGreen)','#4e8f22',3,1)+txt(482,281,'확장 운전',15,'#fff','middle',700);
    s+=rect(0,334,640,36,'#f3f4f5','#d3d6da',0,1)+txt(455,352,'전송',13,'#333')+txt(590,352,'취소',13,'#333');
    return s;
  }
  function sceneControl(){
    return {svg:controlBase(),t:{ext:[345,263,275,36],send:[420,337,70,30]}};
  }

  function dlgFrame(title){
    var s=controlBase()+'<rect x="0" y="0" width="640" height="370" fill="#000" opacity=".5"/>';
    s+=rect(16,52,608,264,'url(#gPanel)','#b4bac0',6,1.5)+txt(320,78,title,15,'#333');
    s+='<line x1="30" y1="94" x2="610" y2="94" stroke="#bcc2c8" stroke-width="1"/>';
    s+=rect(17,268,606,47,'#c4cad0','none',0);
    s+=btn(372,276,118,32,'확인',13)+btn(500,276,110,32,'취소',13);
    return s;
  }
  function sceneExt(p){
    var s=dlgFrame('확장 운전');
    s+=txt(36,126,'재실 감지',13,'#444','start')+btn(130,111,100,30,'꺼짐',12,true);
    s+=txt(36,176,'SPI',13,'#444','start')+toggleOff(130,161,100,30);
    s+=txt(36,226,'운전모드 제한',13,'#444','start')+btn(130,210,104,32,MODELBL[p.val],12);
    s+=txt(330,126,'냉방 온도 제한',13,'#444','start')+btn(492,111,100,30,'18~30°C',12);
    s+=txt(330,176,'난방 온도 제한',13,'#444','start')+btn(492,161,100,30,'16~30°C',12);
    return {svg:s,t:{limit:[130,210,104,32],ok:[372,276,118,32]}};
  }

  function iconSnow(cx,cy,c){
    var g='<g transform="translate('+cx+','+cy+')" stroke="'+c+'" stroke-width="3" stroke-linecap="round">';
    [0,60,120].forEach(function(a){ g+='<line x1="-28" y1="0" x2="28" y2="0" transform="rotate('+a+')"/>'; });

        if(!await wait(950,tk)) return;
        press(finger); press(finger2);
        setScene(f.hold[0],f.hold[1],f.dual[0]); showHl(f.dual);
        if(!await wait(2300,tk)) return;
        hlEl.innerHTML=''; hideF2();
      } else if(f.drag){
        var kc=center('knob'), pos0=f.s[1].pos, pos1=choice.onoff;
        showHl('knob');
        moveFinger(kc[0],kc[1],850);
        if(!await wait(950,tk)) return;
        press(); if(!await wait(350,tk)) return;
        var dy=(OFFS[pos1]-OFFS[pos0])*mapped('knob').k;
        hlEl.innerHTML='';
        document.querySelectorAll('#knob').forEach(function(kn){ kn.style.transition='transform .9s cubic-bezier(.4,0,.2,1)'; kn.style.transform='translateY('+OFFS[pos1]+'px)'; });
        moveFinger(kc[0],kc[1]+dy,900);
        if(!await wait(1100,tk)) return;
      } else {
        showHl(f.tap);
        c=center(f.tap);
        moveFinger(c[0],c[1],850);
        if(!await wait(950,tk)) return;
        press();
        if(!await wait(600,tk)) return;
        hlEl.innerHTML='';
      }
    }
    setScene(st.result()[0],st.result()[1]);
    stepDone=true; renderUI();
    if(!await wait(2000,tk)) return;
    advance();
  }
  function advance(){
    if(!playing || !tab) return;
    var n=steps().length;
    if(cur<n-1){ cur++; } else { cur=0; fingerAt=null; }
    run();
  }
  function go(i){
    var n=steps().length;
    cur=Math.max(0,Math.min(n-1,i)); fingerAt=null; run();
  }

  /* ---------- UI ---------- */
  function renderUI(){
    var S=steps(), n=S.length, html='';
    S.forEach(function(st,i){
      var cls='step'+(i===cur?' on':'')+(i<cur?' done':'');
      html+='<li class="'+cls+'"><button type="button" data-i="'+i+'" aria-current="'+(i===cur?'step':'false')+'"><span class="n">'+(i<cur?'✓':(i+1))+'</span><span class="b"><strong>'+st.title+'</strong><span class="d">'+st.desc+'</span></span></button></li>';
    });
    $('#steps').innerHTML=html;
    $('#count').textContent='단계 '+(cur+1)+' / '+n;
    $('#prog').style.width=(((cur+(stepDone?1:0.5))/n)*100)+'%';
    var pb=$('#play'); pb.textContent=playing?'일시정지':'▶ 재생'; pb.setAttribute('aria-label',playing?'일시정지':'재생');
    var chipEl=$('#chips'), list=CHIPS[tab];
    if(list){
      var ch='<span class="lbl">'+CHIPLABEL[tab]+'</span>';
      list.forEach(function(c){
        ch+='<button type="button" class="chip" data-c="'+c[0]+'" aria-pressed="'+(choice[tab]===c[0])+'">'+c[1]+'</button>';
      });
      chipEl.innerHTML=ch; chipEl.style.display='';
    } else { chipEl.innerHTML=''; chipEl.style.display='none'; }
    $('#stage').className='stage'+(tab==='touch'?' dark':'');
  }

  function renderTabs(){
    var html='';
    BRANDS[brand].tabs.forEach(function(t){
      html+='<button role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>';
    });
    $('#tabs').innerHTML=html;
    $('#tabs').hidden=BRANDS[brand].tabs.length<2;
  }
  function setHash(h){
    try{
      if(h) history.replaceState(null,'','#'+h);
      else history.replaceState(null,'',location.pathname+location.search);
    }catch(e){}
  }

  function showPicker(updateHash){
    token++; brand=null; tab=null; fingerAt=null;
    $('#guide').hidden=true; $('#picker').hidden=false;
    if(updateHash) setHash('');
    window.scrollTo(0,0);
    if(window.notifyParentTop) window.notifyParentTop();
  }
  function showBrand(b,t,updateHash){
    brand=b; tab=t||BRANDS[b].tabs[0][0]; cur=0; fingerAt=null; playing=true;
    var B=BRANDS[b];
    $('#picker').hidden=true; $('#guide').hidden=false;
    $('#g-eyebrow').textContent=B.eyebrow;
    $('#g-title').textContent=B.title;
    $('#g-lead').innerHTML=B.lead;
    $('#notes').innerHTML=B.notes;
    $('#foot').innerHTML=B.foot;
    renderTabs();
    if(updateHash) setHash(b+(tab===B.tabs[0][0]?'':'-'+tab));
    window.scrollTo(0,0);
    if(window.notifyParentTop) window.notifyParentTop();
    run();
  }
  function showTab(t){
    tab=t; cur=0; fingerAt=null;
    renderTabs();
    setHash(brand+(t===BRANDS[brand].tabs[0][0]?'':'-'+t));
    run();
  }

  document.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.dataset.brand){ showBrand(t.dataset.brand,null,true); return; }
    if(t.id==='back'){ showPicker(true); return; }
    if(!brand) return;
    if(t.dataset.tab){ showTab(t.dataset.tab); return; }
    if(t.dataset.i!=null){ go(parseInt(t.dataset.i,10)); return; }
    if(t.dataset.c){ choice[tab]=t.dataset.c; go(CHOICESTEP[tab]); return; }
    if(t.id==='prev'){ go(cur-1); return; }
    if(t.id==='next'){ go(cur+1); return; }
    if(t.id==='play'){
      playing=!playing; renderUI();
      if(playing && stepDone){ advance(); }
    }
  });

  function fromHash(){
    var h=location.hash.replace('#',''), m=/^(samsung|lg|carrier)(?:-([a-z]+))?$/.exec(h);
    if(!m){ if(brand) showPicker(false); return; }
    var B=BRANDS[m[1]], valid=B.tabs.some(function(t){return t[0]===m[2]});
    var wantTab=valid?m[2]:B.tabs[0][0];
    if(m[1]!==brand || wantTab!==tab) showBrand(m[1],wantTab,false);
  }
  function onMQ(){ var was=portrait; portrait=MQ.matches; if(was!==portrait && brand){ fingerAt=null; run(); } }
  if(MQ.addEventListener) MQ.addEventListener('change',onMQ); else if(MQ.addListener) MQ.addListener(onMQ);
  window.addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
</body>
</html>
