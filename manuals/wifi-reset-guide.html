<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wi-Fi 재설정 가이드</title>
<style>
  :root{--blue:#3150f5;--ink:#171a22;--muted:#6e7483;--line:#e9ebf2}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(145deg,#f5f7ff,#fff 52%,#f4fbff);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .guide{max-width:480px;margin:auto;padding:40px 24px 36px}
  .eyebrow{margin:0 0 8px;color:var(--blue);font-weight:800;font-size:14px}
  .title{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}
  .intro{margin:14px 0 22px;color:var(--muted);font-size:17px;line-height:1.65}

  .mfg-tabs{display:inline-flex;padding:5px;background:#eef0f8;border-radius:16px;gap:4px;margin-bottom:22px}
  .mfg-tab{padding:10px 26px;border:0;border-radius:12px;background:transparent;font-weight:800;font-size:15px;color:#6e7483;transition:.25s}
  .mfg-tab.active{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(43,55,101,.14)}

  .stage{display:none;grid-template-columns:1fr;justify-items:center;gap:24px;align-items:center;min-height:auto;background:#fff;border:1px solid #edf0f7;border-radius:30px;padding:28px 20px 32px;box-shadow:0 24px 70px rgba(43,55,101,.11);overflow:hidden}
  .stage.active{display:grid}

  .phone{position:relative;width:300px;margin:auto;background:#111;border:9px solid #181a20;border-radius:44px;box-shadow:0 24px 45px rgba(31,36,57,.2);overflow:hidden}
  .phone-inner{position:relative;width:100%;overflow:hidden;background:#fff}
  .speaker{position:absolute;z-index:6;top:8px;left:50%;width:70px;height:16px;transform:translateX(-50%);border-radius:0 0 12px 12px;background:#181a20}

  .shot{position:absolute;top:0;left:0;width:100%;opacity:0;transition:opacity .35s ease}
  .shot.active{opacity:1;z-index:2}
  .shot img{width:100%;display:block}

  .focus{position:absolute;z-index:8;border:2.5px solid var(--blue);border-radius:12px;box-shadow:0 0 0 999px rgba(24,30,54,.22);opacity:0;pointer-events:none;transition:.4s}
  .tap{position:absolute;z-index:10;width:0;height:0;pointer-events:none}
  .tap .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);opacity:0;transform:scale(.3);transition:opacity .5s ease,transform .5s ease}
  .tap .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--blue);opacity:0;transform:scale(.4);transition:opacity .2s ease,transform .2s ease}
  .tap.show .ring{opacity:.55;transform:scale(2.1)}
  .tap.show .dot{opacity:1;transform:scale(1)}

  .copy{max-width:470px}
  .step-count{display:inline-flex;padding:8px 12px;border-radius:20px;background:#edf0ff;color:var(--blue);font-size:13px;font-weight:900}
  .copy h2{font-size:30px;letter-spacing:-.04em;margin:16px 0 13px}
  .copy p{font-size:17px;line-height:1.7;color:#4e5565;margin:0;min-height:84px}
  .tip{margin-top:20px;padding:15px 17px;background:#f7f8fc;border-radius:13px;color:#596071;font-size:14px;line-height:1.55;min-height:24px}
  .controls{display:flex;align-items:center;gap:11px;margin-top:26px;flex-wrap:wrap}
  .control{border:1px solid #dfe3ee;background:#fff;border-radius:13px;padding:12px 18px;font-weight:800}
  .control.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .control:hover{transform:translateY(-1px)}
  .progress{display:flex;gap:6px;margin-left:5px;flex-wrap:wrap;max-width:140px}
  .dot2{width:8px;height:8px;border-radius:9px;background:#d9dce7;transition:.3s}
  .dot2.on{width:22px;background:var(--blue)}

  @media(max-width:820px){
    .guide{padding:22px 15px}
    .stage{grid-template-columns:1fr;gap:24px;padding:22px 15px;min-height:auto}
    .phone{width:270px}
    .copy{padding:0 8px}
    .copy h2{font-size:25px}
    .copy p{font-size:15.5px;min-height:76px}
    .intro{font-size:15px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="guide">
  <p class="eyebrow">Leaf 앱 이용 가이드</p>
  <h1 class="title">허브 Wi-Fi 재설정하기</h1>
  <p class="intro">매장 Wi-Fi(공유기)를 교체했거나 비밀번호가 바뀌었다면, 허브에 새 Wi-Fi 정보를 다시 연결해 주셔야 해요. 휴대폰 종류에 맞는 탭을 선택해 주세요.</p>

  <div class="mfg-tabs" role="tablist">
    <button class="mfg-tab active" id="tabAndroid" type="button">Android (안드로이드)</button>
    <button class="mfg-tab" id="tabIOS" type="button">iPhone (iOS)</button>
  </div>

  <!-- ANDROID STAGE -->
  <section class="stage active" id="stageAndroid" aria-label="안드로이드 Wi-Fi 재설정 애니메이션">
    <div class="phone">
      <div class="phone-inner" id="innerAndroid" style="aspect-ratio:640/1353">
        <div class="speaker"></div>
        <div class="shot" data-shot="a1"><img src="assets/wifi-android-1.jpg" alt=""></div>
        <div class="shot" data-shot="a2"><img src="assets/wifi-android-2.jpg" alt=""></div>
        <div class="shot" data-shot="a3"><img src="assets/wifi-android-3.jpg" alt=""></div>
        <div class="shot" data-shot="a4"><img src="assets/wifi-android-4.jpg" alt=""></div>
        <div class="shot" data-shot="a5"><img src="assets/wifi-android-5.jpg" alt=""></div>
        <div class="shot" data-shot="a6"><img src="assets/wifi-android-6.jpg" alt=""></div>
        <div class="shot" data-shot="a7"><img src="assets/wifi-android-7.jpg" alt=""></div>
        <div class="shot" data-shot="a8"><img src="assets/wifi-android-8.jpg" alt=""></div>
        <div class="shot" data-shot="a9"><img src="assets/wifi-android-9.jpg" alt=""></div>
        <div class="shot" data-shot="a10"><img src="assets/wifi-android-10.jpg" alt=""></div>
        <div class="shot" data-shot="a11"><img src="assets/wifi-android-11.jpg" alt=""></div>
        <div class="focus" id="focusAndroid"></div>
        <div class="tap" id="tapAndroid"></div>
      </div>
    </div>
    <div class="copy" aria-live="polite">
      <span class="step-count" id="countAndroid">1 / 10</span>
      <h2 id="titleAndroid"></h2>
      <p id="textAndroid"></p>
      <div class="tip" id="tipAndroid"></div>
      <div class="controls">
        <button class="control" id="prevAndroid" type="button">이전</button>
        <button class="control primary" id="nextAndroid" type="button">다음</button>
        <button class="control" id="playAndroid" type="button" aria-pressed="true">일시정지</button>
        <div class="progress" id="progressAndroid" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- IOS STAGE -->
  <section class="stage" id="stageIOS" aria-label="아이폰 Wi-Fi 재설정 애니메이션">
    <div class="phone">
      <div class="phone-inner" id="innerIOS" style="aspect-ratio:640/1312">
        <div class="speaker"></div>
        <div class="shot" data-shot="i1"><img src="assets/wifi-ios-1.jpg" alt=""></div>
        <div class="shot" data-shot="i2"><img src="assets/wifi-ios-2.jpg" alt=""></div>
        <div class="shot" data-shot="i3"><img src="assets/wifi-ios-3.jpg" alt=""></div>
        <div class="shot" data-shot="i4"><img src="assets/wifi-ios-4.jpg" alt=""></div>
        <div class="shot" data-shot="i5"><img src="assets/wifi-ios-5.jpg" alt=""></div>
        <div class="shot" data-shot="i6"><img src="assets/wifi-ios-6.jpg" alt=""></div>
        <div class="shot" data-shot="i7"><img src="assets/wifi-ios-7.jpg" alt=""></div>
        <div class="shot" data-shot="i8"><img src="assets/wifi-ios-8.jpg" alt=""></div>
        <div class="shot" data-shot="i9"><img src="assets/wifi-ios-9.jpg" alt=""></div>
        <div class="shot" data-shot="i10"><img src="assets/wifi-ios-10.jpg" alt=""></div>
        <div class="shot" data-shot="i11"><img src="assets/wifi-ios-11.jpg" alt=""></div>
        <div class="focus" id="focusIOS"></div>
        <div class="tap" id="tapIOS"></div>
      </div>
    </div>
    <div class="copy" aria-live="polite">
      <span class="step-count" id="countIOS">1 / 11</span>
      <h2 id="titleIOS"></h2>
      <p id="textIOS"></p>
      <div class="tip" id="tipIOS"></div>
      <div class="controls">
        <button class="control" id="prevIOS" type="button">이전</button>
        <button class="control primary" id="nextIOS" type="button">다음</button>
        <button class="control" id="playIOS" type="button" aria-pressed="true">일시정지</button>
        <div class="progress" id="progressIOS" aria-hidden="true"></div>
      </div>
    </div>
  </section>
</main>

<script>
  const ANDROID_RATIO = 640/1353;
  const IOS_RATIO = 640/1312;

  const androidSteps = [
    { shot:'a1', title:'기기 관리를 눌러요',
      text:'홈 화면에서 <b>기기 관리</b>를 눌러 기기 목록으로 이동해요.',
      tip:'', taps:[{l:66,t:32,w:28,h:14}] },
    { shot:'a2', title:'기기 관리에서 Wi-Fi 재설정 선택',
      text:'Wi-Fi를 바꿀 기기 상세 화면에서 오른쪽 위 <b>더보기(⋮)</b>를 누르면 메뉴가 열려요. 메뉴에서 <b>Wi-Fi 재설정</b>을 선택해 주세요.',
      tip:'', taps:[{l:4,t:84,w:91,h:7}] },
    { shot:'a3', title:'블루투스 스캔을 켜요',
      text:'허브와 블루투스로 연결하기 위해 <b>블루투스 스캔</b> 토글을 켜주세요. 목록에 허브가 나타나면 눌러서 연결을 시작합니다.',
      tip:'허브와 휴대폰이 가까이 있어야 잘 검색돼요.', taps:[{l:73,t:16,w:18,h:5},{l:3,t:38,w:94,h:11}] },
    { shot:'a4', title:'허브에 연결 중이에요',
      text:'허브와 연결되는 동안 잠시 기다려 주세요. 연결이 완료되면 자동으로 다음 화면으로 넘어가요.',
      tip:'', taps:[] },
    { shot:'a5', title:'Wi-Fi 선택 화면으로 이동',
      text:'<b>Wi-Fi를 선택해주세요</b> 항목을 눌러 매장에 있는 Wi-Fi(공유기) 목록을 불러와요.',
      tip:'', taps:[{l:6,t:18,w:88,h:7}] },
    { shot:'a6', title:'매장 Wi-Fi를 선택하고 확인',
      text:'목록에서 연결할 매장 Wi-Fi를 선택한 뒤, 안내 팝업에서 <b>확인</b>을 눌러주세요.',
      tip:'허브와 가까운 Wi-Fi에 연결하는 것이 안정적이에요.', taps:[{l:4,t:21,w:92,h:7},{l:5,t:87,w:90,h:7}] },
    { shot:'a7', title:'Wi-Fi 비밀번호를 입력해요',
      text:'선택한 Wi-Fi의 <b>비밀번호</b>를 입력해 주세요. SSID는 이미 자동으로 채워져 있어요.',
      tip:'', taps:[{l:6,t:35,w:88,h:5}] },
    { shot:'a8', title:'저장을 눌러요',
      text:'비밀번호 입력을 마쳤다면 <b>저장</b> 버튼을 눌러 허브에 새 Wi-Fi 정보를 전달해요.',
      tip:'', taps:[{l:0,t:47,w:100,h:9}] },
    { shot:'a9', title:'허브 Wi-Fi 정보를 변경하는 중',
      text:'허브가 새로운 Wi-Fi 정보로 바뀌는 중이에요. <b>이 화면에서 앱을 끄면 처음부터 다시 시작해야 하니</b> 잠시만 기다려 주세요.',
      tip:'', taps:[] },
    { shot:'a10', title:'연결 상태를 확인하는 중',
      text:'허브가 변경된 Wi-Fi에 정상적으로 연결되어 있는지 확인하고 있어요. 휴대폰의 블루투스와 Wi-Fi 연결을 그대로 유지해 주세요.',
      tip:'', taps:[] },
    { shot:'a11', title:'재설정이 완료됐어요',
      text:'허브 Wi-Fi 재설정이 완료됐습니다. <b>확인</b>을 눌러 설정을 마무리해 주세요.',
      tip:'', taps:[] }
  ];

  const iosSteps = [
    { shot:'i1', title:'변경할 와이파이를 핸드폰에 연결',
      text:'설정 앱의 <b>Wi-Fi</b> 메뉴에서 아이폰을 설정 변경할 Wi-Fi(공유기)에 연결해 주세요.',
      tip:'허브는 아이폰이 연결된 Wi-Fi 정보를 그대로 가져와요.', taps:[] },
    { shot:'i2', title:'기기 관리를 선택해 주세요',
      text:'LEAF 앱을 실행한 뒤, 홈 화면에서 <b>기기 관리</b>를 눌러 기기 목록으로 이동해요.',
      tip:'', taps:[{l:66,t:29,w:28,h:14}] },
    { shot:'i3', title:'기기 관리에서 Wi-Fi 재설정 선택',
      text:'Wi-Fi를 바꿀 기기 상세 화면에서 오른쪽 위 <b>더보기(⋮)</b>를 누르면 메뉴가 열려요. 메뉴에서 <b>Wi-Fi 재설정</b>을 선택해 주세요.',
      tip:'', taps:[{l:5,t:84,w:90,h:7}] },
    { shot:'i4', title:'블루투스 스캔을 켜요',
      text:'<b>블루투스 스캔</b> 토글을 켜주세요. 허브 가까이에서 스캔해야 검색이 잘 돼요.',
      tip:'거리가 멀면 허브가 검색되지 않을 수 있어요.', taps:[{l:76,t:16,w:16,h:4}] },
    { shot:'i5', title:'목록에서 허브를 선택해요',
      text:'기기 목록에 나타난 허브를 눌러 연결을 시작해요.',
      tip:'', taps:[{l:3,t:36,w:94,h:11}] },
    { shot:'i6', title:'허브에 연결 중이에요',
      text:'허브와 연결되는 동안 잠시 기다려 주세요.',
      tip:'', taps:[] },
    { shot:'i7', title:'Wi-Fi 정보 확인 후 확인을 눌러요',
      text:'Wi-Fi 명을 확인한 뒤 연결할 Wi-Fi가 맞다면 <b>확인</b>을 눌러요.',
      tip:'iOS는 SSID를 자동으로 가져오기 때문에 직접 고르지 않아도 돼요.', taps:[{l:6,t:18,w:88,h:6},{l:5,t:89,w:90,h:6}] },
    { shot:'i8', title:'비밀번호를 입력하고 저장',
      text:'Wi-Fi SSID는 자동으로 채워져 있어요. <b>비밀번호</b>를 입력한 뒤 <b>저장</b>을 눌러주세요.',
      tip:'', taps:[{l:0,t:91,w:100,h:9}] },
    { shot:'i9', title:'허브 Wi-Fi 정보를 변경하는 중',
      text:'허브가 새로운 Wi-Fi 정보로 바뀌는 중이에요. 이 화면에서 앱을 끄면 처음부터 다시 시작해야 하니 잠시만 기다려 주세요.',
      tip:'', taps:[] },
    { shot:'i10', title:'연결 상태를 확인하는 중',
      text:'허브가 변경된 Wi-Fi에 정상적으로 연결되어 있는지 확인하고 있어요. 휴대폰의 블루투스와 Wi-Fi 연결을 그대로 유지해 주세요.',
      tip:'', taps:[] },
    { shot:'i11', title:'재설정이 완료됐어요',
      text:'허브 Wi-Fi 재설정이 완료됐습니다. <b>확인</b>을 눌러 설정을 마무리해 주세요.',
      tip:'', taps:[] }
  ];

  function buildController(prefix, steps, ratio){
    const q = s => document.getElementById(s.charAt(0).toLowerCase() + s.slice(1) + prefix);
    const inner = q('Inner'), focus = q('Focus'), tap = q('Tap');
    const progress = q('Progress');
    steps.forEach((_,n)=>{
      const d = document.createElement('i');
      d.className = 'dot2' + (n===0 ? ' on':'');
      progress.appendChild(d);
    });
    let index = 0, playing = true, timer, seqTimers = [];

    function clearSeq(){ seqTimers.forEach(t=>clearTimeout(t)); seqTimers = []; }
    function showShot(id){
      inner.querySelectorAll('.shot').forEach(s=>s.classList.toggle('active', s.dataset.shot===id));
    }
    function placeFocus(box){
      Object.assign(focus.style, { left:box.l+'%', top:box.t+'%', width:box.w+'%', height:box.h+'%', opacity:1 });
    }
    function pingTap(box){
      tap.style.left = (box.l + box.w/2) + '%';
      tap.style.top = (box.t + box.h/2) + '%';
      tap.classList.remove('show'); void tap.offsetWidth; tap.classList.add('show');
    }
    function hideOverlay(){ focus.style.opacity = 0; tap.classList.remove('show'); }

    function render(i){
      clearSeq();
      index = (i + steps.length) % steps.length;
      const s = steps[index];
      q('Count').textContent = `${index+1} / ${steps.length}`;
      q('Title').textContent = s.title;
      q('Text').innerHTML = s.text;
      q('Tip').textContent = s.tip;
      progress.querySelectorAll('.dot2').forEach((d,n)=>d.classList.toggle('on', n===index));
      showShot(s.shot);
      hideOverlay();
      if (s.taps.length === 1){
        seqTimers.push(setTimeout(()=>{ placeFocus(s.taps[0]); pingTap(s.taps[0]); }, 300));
        seqTimers.push(setTimeout(hideOverlay, 1700));
      } else if (s.taps.length >= 2){
        seqTimers.push(setTimeout(()=>{ placeFocus(s.taps[0]); pingTap(s.taps[0]); }, 300));
        seqTimers.push(setTimeout(()=>{ placeFocus(s.taps[1]); pingTap(s.taps[1]); }, 1500));
        seqTimers.push(setTimeout(hideOverlay, 2600));
      }
    }
    function schedule(){
      clearInterval(timer);
      if (playing) timer = setInterval(()=>render(index+1), 5600);
    }
    q('Next').onclick = ()=>{ render(index+1); schedule(); };
    q('Prev').onclick = ()=>{ render(index-1); schedule(); };
    q('Play').onclick = ()=>{
      playing = !playing;
      q('Play').textContent = playing ? '일시정지' : '자동재생';
      q('Play').setAttribute('aria-pressed', playing);
      schedule();
    };
    render(0);
    schedule();
    return { render, schedule };
  }

  const androidCtrl = buildController('Android', androidSteps, ANDROID_RATIO);
  const iosCtrl = buildController('IOS', iosSteps, IOS_RATIO);

  const tabAndroid = document.getElementById('tabAndroid');
  const tabIOS = document.getElementById('tabIOS');
  const stageAndroid = document.getElementById('stageAndroid');
  const stageIOS = document.getElementById('stageIOS');

  tabAndroid.onclick = ()=>{
    tabAndroid.classList.add('active'); tabIOS.classList.remove('active');
    stageAndroid.classList.add('active'); stageIOS.classList.remove('active');
  };
  tabIOS.onclick = ()=>{
    tabIOS.classList.add('active'); tabAndroid.classList.remove('active');
    stageIOS.classList.add('active'); stageAndroid.classList.remove('active');
  };
</script>
</body>
</html>
