<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>스마트예약 새 스케줄 추가하기 | 고객 안내</title>
<style>
  :root{--blue:#3150f5;--ink:#171a22;--muted:#6e7483}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(145deg,#f5f7ff,#fff 52%,#f4fbff);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .guide{max-width:1060px;margin:auto;padding:42px 24px 36px}
  .eyebrow{margin:0 0 8px;color:var(--blue);font-weight:800;font-size:14px}
  .title{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.04em}
  .intro{margin:14px 0 26px;color:var(--muted);font-size:17px;line-height:1.65}

  .stage{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:60px;align-items:center;min-height:640px;background:#fff;border:1px solid #edf0f7;border-radius:30px;padding:36px 64px;box-shadow:0 24px 70px rgba(43,55,101,.11);overflow:hidden}

  .phone{position:relative;width:300px;margin:auto;background:#111;border:9px solid #181a20;border-radius:44px;box-shadow:0 24px 45px rgba(31,36,57,.2);overflow:hidden}
  .phone-inner{position:relative;width:100%;aspect-ratio:556/960;overflow:hidden;background:#fff}
  .speaker{position:absolute;z-index:6;top:8px;left:50%;width:70px;height:16px;transform:translateX(-50%);border-radius:0 0 12px 12px;background:#181a20}

  .shot{position:absolute;inset:0;opacity:0;transition:opacity .4s ease}
  .shot.active{opacity:1;z-index:2}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}

  /* mouse pointer indicator - no screen dimming */
  .pointer{position:absolute;z-index:12;width:22px;height:30px;opacity:0;pointer-events:none;
    transition:left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1), opacity .25s ease;}
  .pointer.show{opacity:1;animation:bob 1.6s ease-in-out infinite}
  .pointer svg{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(20,25,45,.35))}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .ripple{position:absolute;z-index:11;width:26px;height:26px;margin-left:-3px;margin-top:-3px;border-radius:50%;
    border:2px solid var(--blue);opacity:0;pointer-events:none}
  .ripple.show{animation:clickPulse .65s ease-out}
  @keyframes clickPulse{0%{opacity:.75;transform:scale(.35)}70%{opacity:.25;transform:scale(1.7)}100%{opacity:0;transform:scale(2)}}

  .copy{max-width:470px}
  .step-count{display:inline-flex;padding:8px 12px;border-radius:20px;background:#edf0ff;color:var(--blue);font-size:13px;font-weight:900}
  .copy h2{font-size:30px;letter-spacing:-.04em;margin:16px 0 13px}
  .copy p{font-size:18px;line-height:1.7;color:#4e5565;margin:0;min-height:92px}
  .tip{margin-top:22px;padding:15px 17px;background:#f7f8fc;border-radius:13px;color:#596071;font-size:14px;line-height:1.6;min-height:24px}
  .controls{display:flex;align-items:center;gap:11px;margin-top:28px;flex-wrap:wrap}
  .control{border:1px solid #dfe3ee;background:#fff;border-radius:13px;padding:12px 18px;font-weight:800}
  .control.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .control:hover{transform:translateY(-1px)}
  .progress{display:flex;gap:6px;margin-left:5px}
  .dot2{width:8px;height:8px;border-radius:9px;background:#d9dce7;transition:.3s}
  .dot2.on{width:22px;background:var(--blue)}

  @media(max-width:820px){
    .guide{padding:24px 15px}
    .stage{grid-template-columns:1fr;gap:24px;padding:24px 15px;min-height:auto}
    .phone{width:270px}
    .copy{padding:0 8px}
    .copy h2{font-size:25px}
    .copy p{font-size:16px;min-height:96px}
    .intro{font-size:15px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="guide">
  <p class="eyebrow">Leaf 앱 이용 가이드</p>

<script>
  // tap: single point {x, y} in % of the phone-inner box, or null for no pointer
  const steps = [
    { shot:'shot1',
      title:'스마트예약 탭을 눌러요',
      text:'하단 메뉴의 <b>스마트예약</b> 탭을 눌러주세요. A커피 강동점에 등록된 예약 스케줄 화면으로 이동해요.',
      tip:'',
      tap:{x:50.0, y:94.8}
    },
    { shot:'shot2',
      title:'신규 예약 추가를 눌러요',
      text:'화면 아래 <b>+ 신규 예약 추가</b> 버튼을 누르면 새로운 스케줄을 만들 수 있어요.',
      tip:'',
      tap:{x:50.0, y:85.0}
    },
    { shot:'shot3',
      title:'스케줄 종류를 정하고 시간을 설정해요',
      text:'원하는 스케줄 종류를 선택하고 시간을 설정한 뒤 <b>다음으로</b>를 눌러주세요.',
      tip:'시작-종료 스케줄은 에어컨이 자동으로 켜질 시간과 꺼질 시간을 모두 설정해요. 종료만 스케줄은 에어컨을 켜는 것은 앱에서 직접 하고, 꺼지는 시간만 정해진 시간에 자동으로 꺼져요.',
      tap:{x:50.0, y:96.9}
    },
    { shot:'shot4',
      title:'적용할 에어컨을 선택해요',
      text:'이 스케줄을 적용할 에어컨을 선택하고 <b>다음으로</b>를 눌러주세요.',
      tip:'여러 공간의 에어컨을 한 번에 선택해 같은 스케줄을 적용할 수도 있어요.',
      tap:{x:60.7, y:96.9}
    },
    { shot:'shot5',
      title:'켜질 때의 모드·온도·풍량을 설정해요',
      text:'에어컨이 켜질 때 적용될 가동모드(냉방·송풍·난방), 온도, 풍량을 선택하고 <b>설정완료</b>를 눌러주세요.',
      tip:'여기서 설정하는 온도는 공간의 온도를 맞추는 게 아니라, 에어컨이 켜지는 순간에 적용될 시작 온도를 정하는 거예요.',
      tap:{x:71.5, y:96.9}
    },
    { shot:'shot6',
      title:'완료된 스케줄을 확인해요',
      text:'설정한 시간, 반복 요일, 에어컨, 모드와 온도가 맞는지 확인하고 <b>확인</b>을 누르면 스케줄 등록이 끝나요.',
      tip:'등록된 스케줄은 목록에서 토글 버튼으로 언제든 켜고 끌 수 있어요.',
      tap:{x:50.0, y:95.4}
    }
  ];

  let index = 0, playing = true, timer, seqTimers = [];
  const q = s => document.querySelector(s);
  const inner = q('#phoneInner'), pointer = q('#pointer'), ripple = q('#ripple');

  function clearSeq(){ seqTimers.forEach(t=>clearTimeout(t)); seqTimers = []; }

  function showShot(id){
    document.querySelectorAll('.shot').forEach(s=>s.classList.toggle('active', s.id===id));
  }

  function hidePointer(){
    pointer.classList.remove('show');
    ripple.classList.remove('show');
  }

  function moveToTap(t){
    pointer.style.left = t.x+'%';
    pointer.style.top = t.y+'%';
    ripple.style.left = t.x+'%';
    ripple.style.top = t.y+'%';
    pointer.classList.add('show');
    ripple.classList.remove('show'); void ripple.offsetWidth; ripple.classList.add('show');
  }

  function render(i){
    clearSeq();
    index = (i + steps.length) % steps.length;
    const s = steps[index];
    q('#count').textContent = `${index+1} / ${steps.length}`;
    q('#stepTitle').textContent = s.title;
    q('#stepText').innerHTML = s.text;
    q('#tip').textContent = s.tip;
    document.querySelectorAll('.dot2').forEach((d,n)=>d.classList.toggle('on', n===index));

    showShot(s.shot);
    hidePointer();

    if(s.tap){
      seqTimers.push(setTimeout(()=>{ moveToTap(s.tap); }, 350));
    }
  }

  function schedule(){
    clearInterval(timer);
    if(playing) timer = setInterval(()=>render(index+1), 5800);
  }

  q('#next').onclick = ()=>{ render(index+1); schedule(); };
  q('#prev').onclick = ()=>{ render(index-1); schedule(); };
  q('#play').onclick = ()=>{
    playing = !playing;
    q('#play').textContent = playing ? '일시정지' : '자동재생';
    q('#play').setAttribute('aria-pressed', playing);
    schedule();
  };

  render(0);
  schedule();
</script>
